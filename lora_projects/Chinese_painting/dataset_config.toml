# Dataset Configuration for Chinese_painting LoRA Training

[general]
resolution = 512
shuffle_caption = true
keep_tokens = 1
flip_aug = true
caption_extension = ".txt"
enable_bucket = true
bucket_reso_steps = 64
bucket_no_upscale = false
min_bucket_reso = 256
max_bucket_reso = 1024

[[datasets]]

[[datasets.subsets]]
num_repeats = 10
image_dir = "./lora_projects/Chinese_painting/dataset"
